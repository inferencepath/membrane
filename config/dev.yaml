# Membrane — local development configuration (managed mode).
#
# A loopback-only profile for running Membrane on your workstation. All
# operational config lives in the managed state store under data_dir; this file
# carries only bootstrap settings. Secrets are NEVER inline.
#
# Quick start:
#   mkdir -p .membrane
#   export OPENAI_API_KEY=local-dev            # placeholder; local servers ignore it
#   make run CONFIG=./config/dev.yaml          # or: go run ./cmd/membrane --config ./config/dev.yaml --seed ./config/seed.example.yaml
#   # then open the Console at http://127.0.0.1:7474
#
# To point `chat` at a local OpenAI-compatible server (Ollama :11434, vLLM/LM
# Studio :8000/:1234), edit the pathway in the Console or apply a bundle:
#   membrane config apply -f ./config/seed.example.yaml
server:
  address: ":8080"
  shutdown_timeout: "30s"

# Managed state store directory (relative to the repo for local dev). First run
# creates it empty; seed it with --seed ./config/seed.example.yaml, apply a
# bundle, or configure via the Console.
data_dir: "./.membrane"

audit:
  sink: "discard"

# Console on a loopback admin listener; no token needed for local (loopback)
# access.
console:
  enabled: true
  address: "127.0.0.1:7474"
